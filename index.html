<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akashvani Live - Radio India Manager & Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- HLS.js for m3u8 streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        /* Soundwave animation */
        .bar {
            width: 3px;
            background: #f97316;
            animation: bounce 1.2s ease-in-out infinite;
            border-radius: 3px;
        }
        .bar:nth-child(2) { animation-delay: -1.0s; }
        .bar:nth-child(3) { animation-delay: -0.8s; }
        .bar:nth-child(4) { animation-delay: -0.6s; }
        .bar:nth-child(5) { animation-delay: -0.4s; }
        @keyframes bounce {
            0%, 100% { height: 4px; }
            50% { height: 22px; }
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans overflow-hidden bg-slate-950 text-slate-100">

    <!-- Header Section -->
    <header class="h-16 border-b border-slate-800 bg-slate-900/80 backdrop-blur px-4 md:px-8 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-orange-500 to-amber-400 p-2 rounded-xl shadow-lg shadow-orange-500/20 text-white">
                <i data-lucide="radio" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide bg-gradient-to-r from-orange-400 to-amber-200 bg-clip-text text-transparent">
                    ASHOK KUMAR YADAW
                </h1>
                <p class="text-xs text-slate-400">All India Radio Player</p>
            </div>
        </div>

        <!-- Dynamic Action Buttons & View Tabs -->
        <div class="flex items-center gap-2 md:gap-3">
            <button onclick="switchTab('all')" id="tab-btn-all" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-orange-500 text-slate-950 shadow-md transition flex items-center gap-1.5">
                <i data-lucide="list" class="w-4 h-4"></i>
                <span class="hidden sm:inline">All Stations</span>
            </button>
            <button onclick="switchTab('favs')" id="tab-btn-favs" class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center gap-1.5">
                <i data-lucide="heart" class="w-4 h-4 text-rose-500"></i>
                <span class="hidden sm:inline">Favorites</span>
            </button>
            <button onclick="openAddModal()" class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-orange-500/50 bg-orange-500/10 hover:bg-orange-500/20 text-orange-400 transition flex items-center gap-1.5">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>Add Station</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Sidebar Controls & Filters -->
        <aside class="w-full md:w-80 border-b md:border-b-0 md:border-r border-slate-800 bg-slate-900/50 p-4 flex flex-col gap-4 shrink-0 overflow-y-auto">
            
            <!-- Search Bar -->
            <div>
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 block">Search Station</label>
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" id="search-input" placeholder="Name or City..." 
                           class="w-full pl-9 pr-8 py-2 bg-slate-800/80 border border-slate-700/80 rounded-lg text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-orange-500 transition">
                    <button id="clear-search" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- State Filter -->
            <div>
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 block">State / Region</label>
                <select id="state-select" class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700/80 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-orange-500 transition">
                    <option value="">All States</option>
                </select>
            </div>

            <!-- Language Filter -->
            <div>
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 block">Language</label>
                <select id="language-select" class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700/80 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-orange-500 transition">
                    <option value="">All Languages</option>
                </select>
            </div>

            <!-- Data Tools (Export / Import / Reset) -->
            <div class="pt-3 border-t border-slate-800 flex flex-col gap-2">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-0.5">Manage Dataset</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="exportData()" class="px-2.5 py-1.5 text-xs rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center justify-center gap-1">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i> Export JSON
                    </button>
                    <label class="px-2.5 py-1.5 text-xs rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center justify-center gap-1 cursor-pointer">
                        <i data-lucide="upload" class="w-3.5 h-3.5"></i> Import JSON
                        <input type="file" id="import-file-input" accept=".json" onchange="importData(event)" class="hidden">
                    </label>
                </div>
                <button onclick="resetDefaultData()" class="w-full mt-1 px-2.5 py-1.5 text-xs rounded-lg border border-rose-500/30 bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 transition flex items-center justify-center gap-1">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Restore Default Stations
                </button>
            </div>

            <!-- Quick Stats & Reset Filters -->
            <div class="mt-auto pt-4 border-t border-slate-800 flex justify-between items-center text-xs text-slate-500">
                <button onclick="resetFilters()" class="text-orange-400 hover:underline flex items-center gap-1">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Reset Filters
                </button>
                <span id="visible-count">Showing 0</span>
            </div>
        </aside>

        <!-- Radio Grid Area -->
        <main class="flex-1 p-4 md:p-6 overflow-y-auto pb-28">
            <div id="stations-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                <!-- Station Cards injected dynamically -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
                <div class="p-4 bg-slate-900 rounded-full border border-slate-800 text-slate-500 mb-3">
                    <i data-lucide="radio-off" class="w-10 h-10"></i>
                </div>
                <h3 class="text-lg font-semibold text-slate-300">No stations found</h3>
                <p class="text-sm text-slate-500 max-w-sm mt-1">Try adjusting your search queries, clearing category filters, or adding a new station.</p>
                <button onclick="openAddModal()" class="mt-4 px-4 py-2 bg-orange-500 hover:bg-orange-400 text-slate-950 font-semibold text-xs rounded-lg shadow-md transition flex items-center gap-1.5">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add New Station
                </button>
            </div>
        </main>
    </div>

    <!-- Sticky Audio Player Bar -->
    <footer id="player-bar" class="fixed bottom-0 left-0 right-0 h-24 bg-slate-900/95 border-t border-slate-800/80 backdrop-blur-md px-4 md:px-8 flex items-center justify-between z-20 shadow-2xl">
        
        <!-- Currently Playing Info -->
        <div class="flex items-center gap-4 w-1/3 min-w-[180px]">
            <div class="relative w-12 h-12 rounded-xl bg-slate-800 border border-slate-700/80 flex items-center justify-center shrink-0 overflow-hidden group">
                <i id="player-icon" data-lucide="radio" class="w-6 h-6 text-orange-400"></i>
                <!-- Equalizer Animation when playing -->
                <div id="equalizer" class="hidden absolute inset-0 bg-slate-900/90 flex items-center justify-center gap-0.5">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
            <div class="overflow-hidden">
                <h4 id="current-title" class="font-semibold text-sm text-slate-200 truncate">Select a Station</h4>
                <p id="current-subtitle" class="text-xs text-slate-400 truncate">Click on any station to start streaming</p>
                <div id="epg-link-container" class="hidden mt-0.5">
                    <a id="current-epg" href="#" target="_blank" rel="noopener noreferrer" class="text-[11px] text-orange-400 hover:underline inline-flex items-center gap-1">
                        View Schedule <i data-lucide="external-link" class="w-2.5 h-2.5"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Player Controls (Prev, Play/Pause, Next) -->
        <div class="flex flex-col items-center gap-1 w-1/3">
            <div class="flex items-center gap-3 md:gap-4">
                <button onclick="playPrevStation()" id="prev-btn" disabled class="p-2 text-slate-400 hover:text-slate-100 disabled:opacity-30 disabled:hover:text-slate-400 transition">
                    <i data-lucide="skip-back" class="w-5 h-5"></i>
                </button>
                <button id="play-pause-btn" onclick="togglePlayPause()" disabled class="w-12 h-12 rounded-full bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold flex items-center justify-center transition disabled:opacity-40 disabled:hover:bg-orange-500 shadow-lg shadow-orange-500/20">
                    <i id="play-btn-icon" data-lucide="play" class="w-6 h-6 fill-current ml-0.5"></i>
                </button>
                <button onclick="playNextStation()" id="next-btn" disabled class="p-2 text-slate-400 hover:text-slate-100 disabled:opacity-30 disabled:hover:text-slate-400 transition">
                    <i data-lucide="skip-forward" class="w-5 h-5"></i>
                </button>
            </div>
            <span id="player-status" class="text-[11px] font-medium text-slate-500 uppercase tracking-wider">Ready</span>
        </div>

        <!-- Volume & Tools -->
        <div class="flex items-center justify-end gap-3 w-1/3">
            <button id="mute-btn" onclick="toggleMute()" class="text-slate-400 hover:text-slate-200 transition">
                <i id="mute-icon" data-lucide="volume-2" class="w-5 h-5"></i>
            </button>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" 
                   class="w-20 md:w-28 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500">
        </div>
    </footer>

    <!-- Edit/Add Station Modal -->
    <div id="station-modal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col">
            <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                <h3 id="modal-title" class="text-base font-bold text-slate-100 flex items-center gap-2">
                    <i data-lucide="edit-3" class="w-5 h-5 text-orange-400"></i> Edit Station
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 p-1 rounded-lg hover:bg-slate-800 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="station-form" onsubmit="saveStation(event)" class="p-6 space-y-4">
                <input type="hidden" id="edit-index" value="-1">
                
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Station Name *</label>
                    <input type="text" id="modal-name" required placeholder="e.g. Vividh Bharati Delhi" 
                           class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Stream URL (.m3u8) *</label>
                    <input type="url" id="modal-stream" required placeholder="https://domain.com/live/stream.m3u8" 
                           class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">State / Region *</label>
                        <input type="text" id="modal-state" required placeholder="e.g. DELHI" 
                               class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Language *</label>
                        <input type="text" id="modal-language" required placeholder="e.g. Hindi, English" 
                               class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div class="col-span-2">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">EPG / Schedule Link</label>
                        <input type="url" id="modal-epg-url" placeholder="https://cuesheets.prasarbharati.org/..." 
                               class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">EPG ID</label>
                        <input type="text" id="modal-epg-id" placeholder="e.g. 1" 
                               class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-800 flex items-center justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-slate-200 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 transition">
                        Cancel
                    </button>
                    <button type="submit" class="px-5 py-2 text-xs font-semibold text-slate-950 bg-orange-500 hover:bg-orange-400 rounded-lg shadow-md transition">
                        Save Station
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Message / Notification Banner -->
    <div id="toast" class="fixed top-4 right-4 z-50 hidden bg-slate-900 border border-orange-500/50 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300">
        <i id="toast-icon" data-lucide="check-circle" class="w-5 h-5 text-orange-400"></i>
        <span id="toast-msg" class="text-xs font-medium">Station saved successfully</span>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audio-player" class="hidden"></audio>

            { "name": "Akashvani Dibrugarh", "stream_url": "https://radio.wavespb.com/live/6db6683f71f6df13/6db6683f71f6df13.m3u8", "state": "ASSAM", "language": "Assamese, Hindi, English", "epg_url": "https://cuesheets.prasarbharati.org/viewsheet/275", "epg_id": "59" },
            { "name": "Akashvani Guwahati Mahabahu", "stream_url": "https://radio.wavespb.com/live/d1712a1355f27abb/d1712a1355f27abb.m3u8", "state": "ASSAM", "language": "Assamese, Hindi, English", "epg_url": "https://cuesheets.prasarbharati.org/viewsheet/261", "epg_id": "61" },
            { "name": "Akashvani Patna", "stream_url": "https://air.pc.cdn.bitgravity.com/air/live/pbaudio087/playlist.m3u8", "state": "BIHAR", "language": "Maithili, Hindi", "epg_url": "https://cuesheets.prasarbharati.org/viewsheet/337", "epg_id": "70" },
            { "name": "Akashvani Chandigarh", "stream_url": "https://radio.wavespb.com/live/db4a912ff7882d9d/db4a912ff7882d9d.m3u8", "state": "CHANDIGARH", "language": "Punjabi, Hindi, English", "epg_url": "https://cuesheets.prasarbharati.org/viewsheet/208", "epg_id": "75" },
            { "name": "FM Gold Mumbai", "stream_url": "https://d3r9rhourdc02u.cloudfront.net/assets/radio/airmum01/air049_Auto.m3u8", "state": "MAHARASHTRA", "language": "Marathi, Hindi, English", "epg_url": "https://cuesheets.prasarbharati.org/viewsheet/128", "epg_id": "169" },
            { "name": "FM Rainbow Mumbai", "stream_url": "https://d3r9rhourdc02u.cloudfront.net/assets/radio/airmum02/air050_Auto.m3u8", "state": "MAHARASHTRA", "language": "Marathi, Hindi, English", "epg_url": "https://cuesheets.prasarbharati.org/viewsheet/129", "epg_id": "170" },
            { "name": "Akashvani Pune", "stream_url": "https://radio.wavespb.com/live/39d650ca0476a1fe/39d650ca0476a1fe.m3u8", "state": "MAHARASHTRA", "language": "Marathi, Hindi, English", "epg_url": "https://cuesheets.prasarbharati.org/viewsheet/162", "epg_id": "179" }
        ];

        // Application State
        let stations = [];
        let filteredStations = [];
        let currentStation = null;
        let currentStationIndex = -1;
        let hls = null;
        let favorites = [];
        let currentTab = 'all'; // 'all' or 'favs'

        // DOM Elements
        const audio = document.getElementById('audio-player');
        const stationsGrid = document.getElementById('stations-grid');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const stateSelect = document.getElementById('state-select');
        const languageSelect = document.getElementById('language-select');
        const clearSearchBtn = document.getElementById('clear-search');
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playBtnIcon = document.getElementById('play-btn-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const playerStatus = document.getElementById('player-status');
        const currentTitle = document.getElementById('current-title');
        const currentSubtitle = document.getElementById('current-subtitle');
        const epgContainer = document.getElementById('epg-link-container');
        const epgLink = document.getElementById('current-epg');
        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');
        const muteIcon = document.getElementById('mute-icon');
        const equalizer = document.getElementById('equalizer');

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            loadStationsFromStorage();
            loadFavorites();
            initFilterOptions();
            renderStations();
            setupAudioEvents();
            lucide.createIcons();
        });

        // Load / Save LocalStorage
        function loadStationsFromStorage() {
            const stored = localStorage.getItem('akashvani_editable_stations');
            if (stored) {
                try {
                    stations = JSON.parse(stored);
                } catch(e) {
                    stations = [...DEFAULT_STATIONS_DATA];
                }
            } else {
                stations = [...DEFAULT_STATIONS_DATA];
            }
        }

        function saveStationsToStorage() {
            localStorage.setItem('akashvani_editable_stations', JSON.stringify(stations));
            initFilterOptions();
            renderStations();
        }

        function loadFavorites() {
            favorites = JSON.parse(localStorage.getItem('akashvani_favs') || '[]');
        }

        function saveFavorites() {
            localStorage.setItem('akashvani_favs', JSON.stringify(favorites));
        }

        // Initialize Filter Dropdowns
        function initFilterOptions() {
            const currentSelectedState = stateSelect.value;
            const currentSelectedLang = languageSelect.value;

            stateSelect.innerHTML = '<option value="">All States</option>';
            languageSelect.innerHTML = '<option value="">All Languages</option>';

            const states = new Set();
            const languages = new Set();

            stations.forEach(s => {
                if (s.state) states.add(s.state.trim().toUpperCase());
                if (s.language) {
                    s.language.split(',').forEach(l => languages.add(l.trim()));
                }
            });

            Array.from(states).sort().forEach(state => {
                const opt = document.createElement('option');
                opt.value = state;
                opt.textContent = state;
                if (state === currentSelectedState) opt.selected = true;
                stateSelect.appendChild(opt);
            });

            Array.from(languages).sort().forEach(lang => {
                const opt = document.createElement('option');
                opt.value = lang;
                opt.textContent = lang;
                if (lang === currentSelectedLang) opt.selected = true;
                languageSelect.appendChild(opt);
            });

            // Event Listeners
            searchInput.oninput = () => {
                clearSearchBtn.classList.toggle('hidden', !searchInput.value);
                renderStations();
            };
            stateSelect.onchange = renderStations;
            languageSelect.onchange = renderStations;
        }

        // Tab Switcher
        function switchTab(tab) {
            currentTab = tab;
            const tabAll = document.getElementById('tab-btn-all');
            const tabFavs = document.getElementById('tab-btn-favs');

            if (tab === 'all') {
                tabAll.className = 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-orange-500 text-slate-950 shadow-md transition flex items-center gap-1.5';
                tabFavs.className = 'px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center gap-1.5';
            } else {
                tabFavs.className = 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-orange-500 text-slate-950 shadow-md transition flex items-center gap-1.5';
                tabAll.className = 'px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center gap-1.5';
            }
            renderStations();
        }

        // Filter and Render Station Cards
        function renderStations() {
            const query = searchInput.value.toLowerCase().trim();
            const selectedState = stateSelect.value;
            const selectedLanguage = languageSelect.value;

            filteredStations = stations.filter(station => {
                const matchesSearch = station.name.toLowerCase().includes(query) || 
                                      (station.state && station.state.toLowerCase().includes(query)) ||
                                      (station.language && station.language.toLowerCase().includes(query));
                const matchesState = !selectedState || (station.state && station.state.toUpperCase() === selectedState);
                const matchesLanguage = !selectedLanguage || (station.language && station.language.includes(selectedLanguage));
                const matchesFavs = currentTab !== 'favs' || favorites.includes(station.name);

                return matchesSearch && matchesState && matchesLanguage && matchesFavs;
            });

            stationsGrid.innerHTML = '';
            document.getElementById('visible-count').innerText = `Showing ${filteredStations.length} of ${stations.length}`;

            if (filteredStations.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                filteredStations.forEach((station, index) => {
                    const originalIndex = stations.findIndex(s => s === station);
                    const isFav = favorites.includes(station.name);
                    const isPlayingCurrent = currentStation && currentStation.name === station.name;

                    const card = document.createElement('div');
                    card.className = `group relative p-4 rounded-xl border transition-all duration-200 cursor-pointer flex flex-col justify-between ${
                        isPlayingCurrent 
                        ? 'bg-slate-900 border-orange-500/80 shadow-lg shadow-orange-500/10' 
                        : 'bg-slate-900/60 hover:bg-slate-900 border-slate-800/80 hover:border-slate-700'
                    }`;

                    card.onclick = () => selectStation(station, index);

                    card.innerHTML = `
                        <div>
                            <div class="flex items-start justify-between gap-2 mb-2">
                                <div class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase bg-orange-500/10 text-orange-400 border border-orange-500/20">
                                    ${station.state || 'INDIA'}
                                </div>
                                <div class="flex items-center gap-1" onclick="event.stopPropagation()">
                                    <button onclick="toggleFavorite(event, '${escapeQuotes(station.name)}')" title="Toggle Favorite" class="text-slate-500 hover:text-rose-500 transition p-1">
                                        <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-rose-500 text-rose-500' : ''}"></i>
                                    </button>
                                    <button onclick="openEditModal(event, ${originalIndex})" title="Edit Station" class="text-slate-500 hover:text-orange-400 transition p-1">
                                        <i data-lucide="edit-2" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="deleteStation(event, ${originalIndex})" title="Delete Station" class="text-slate-500 hover:text-rose-400 transition p-1">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                            <h3 class="font-semibold text-base text-slate-100 group-hover:text-orange-400 transition truncate mb-1">
                                ${station.name}
                            </h3>
                            <p class="text-xs text-slate-400 truncate mb-3">
                                ${station.language || 'Multiple Languages'}
                            </p>
                        </div>
                        
                        <div class="pt-3 border-t border-slate-800/60 flex items-center justify-between text-xs text-slate-500">
                            <span class="flex items-center gap-1 text-[11px] ${isPlayingCurrent ? 'text-orange-400 font-medium' : ''}">
                                <i data-lucide="${isPlayingCurrent ? 'radio' : 'wifi'}" class="w-3 h-3 ${isPlayingCurrent ? 'animate-pulse text-orange-400' : 'text-emerald-400'}"></i>
                                ${isPlayingCurrent ? 'Now Playing' : 'Live Stream'}
                            </span>
                            ${station.epg_url && station.epg_url.includes('http') ? `
                                <a href="${station.epg_url}" target="_blank" onclick="event.stopPropagation()" class="text-slate-400 hover:text-slate-200 flex items-center gap-1 text-[11px]">
                                    Schedule <i data-lucide="external-link" class="w-2.5 h-2.5"></i>
                                </a>
                            ` : ''}
                        </div>
                    `;

                    stationsGrid.appendChild(card);
                });
                lucide.createIcons();
            }
        }

        function escapeQuotes(str) {
            return (str || '').replace(/'/g, "\\'");
        }

        // Station Selection & Playback
        function selectStation(station, filteredIndex) {
            currentStation = station;
            currentStationIndex = filteredIndex;
            currentTitle.innerText = station.name;
            currentSubtitle.innerText = `${station.state || 'India'} • ${station.language || 'Standard'}`;

            if (station.epg_url && station.epg_url.includes('http')) {
                epgLink.href = station.epg_url;
                epgContainer.classList.remove('hidden');
            } else {
                epgContainer.classList.add('hidden');
            }

            playPauseBtn.disabled = false;
            prevBtn.disabled = filteredStations.length <= 1;
            nextBtn.disabled = filteredStations.length <= 1;

            updatePlayerState('Loading...', true);

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({ enableWorker: true });
                hls.loadSource(station.stream_url);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    audio.play().catch(() => updatePlayerState('Click Play', false));
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        updatePlayerState('Stream Error', false);
                    }
                });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = station.stream_url;
                audio.play().catch(() => updatePlayerState('Click Play', false));
            } else {
                updatePlayerState('HLS Not Supported', false);
            }

            renderStations();
        }

        // Prev & Next Player Controls
        function playNextStation() {
            if (filteredStations.length === 0) return;
            const nextIdx = (currentStationIndex + 1) % filteredStations.length;
            selectStation(filteredStations[nextIdx], nextIdx);
        }

        function playPrevStation() {
            if (filteredStations.length === 0) return;
            const prevIdx = (currentStationIndex - 1 + filteredStations.length) % filteredStations.length;
            selectStation(filteredStations[prevIdx], prevIdx);
        }

        // Play/Pause Audio Controls
        function togglePlayPause() {
            if (!currentStation) return;
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function setupAudioEvents() {
            audio.addEventListener('play', () => {
                updatePlayerState('Playing', true);
                playBtnIcon.setAttribute('data-lucide', 'pause');
                equalizer.classList.remove('hidden');
                lucide.createIcons();
            });

            audio.addEventListener('pause', () => {
                updatePlayerState('Paused', false);
                playBtnIcon.setAttribute('data-lucide', 'play');
                equalizer.classList.add('hidden');
                lucide.createIcons();
            });

            audio.addEventListener('waiting', () => {
                updatePlayerState('Buffering...', true);
            });

            volumeSlider.addEventListener('input', (e) => {
                audio.volume = e.target.value;
                audio.muted = audio.volume === 0;
                updateMuteIcon();
            });
        }

        function toggleMute() {
            audio.muted = !audio.muted;
            updateMuteIcon();
        }

        function updateMuteIcon() {
            if (audio.muted || audio.volume === 0) {
                muteIcon.setAttribute('data-lucide', 'volume-x');
            } else {
                muteIcon.setAttribute('data-lucide', 'volume-2');
            }
            lucide.createIcons();
        }

        function updatePlayerState(statusText, isPlaying) {
            playerStatus.innerText = statusText;
        }

        // Favorites Handling
        function toggleFavorite(event, stationName) {
            if (event) event.stopPropagation();
            if (favorites.includes(stationName)) {
                favorites = favorites.filter(f => f !== stationName);
                showToast('Removed from favorites');
            } else {
                favorites.push(stationName);
                showToast('Added to favorites');
            }
            saveFavorites();
            renderStations();
        }

        // CRUD Modals and Operations
        function openAddModal() {
            document.getElementById('modal-title').innerText = 'Add New Radio Station';
            document.getElementById('edit-index').value = '-1';
            document.getElementById('modal-name').value = '';
            document.getElementById('modal-stream').value = '';
            document.getElementById('modal-state').value = '';
            document.getElementById('modal-language').value = '';
            document.getElementById('modal-epg-url').value = '';
            document.getElementById('modal-epg-id').value = '';

            document.getElementById('station-modal').classList.remove('hidden');
        }

        function openEditModal(event, index) {
            if (event) event.stopPropagation();
            const station = stations[index];
            if (!station) return;

            document.getElementById('modal-title').innerText = 'Edit Station';
            document.getElementById('edit-index').value = index;
            document.getElementById('modal-name').value = station.name || '';
            document.getElementById('modal-stream').value = station.stream_url || '';
            document.getElementById('modal-state').value = station.state || '';
            document.getElementById('modal-language').value = station.language || '';
            document.getElementById('modal-epg-url').value = station.epg_url || '';
            document.getElementById('modal-epg-id').value = station.epg_id || '';

            document.getElementById('station-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('station-modal').classList.add('hidden');
        }

        function saveStation(event) {
            event.preventDefault();

            const idx = parseInt(document.getElementById('edit-index').value);
            const newStationData = {
                name: document.getElementById('modal-name').value.trim(),
                stream_url: document.getElementById('modal-stream').value.trim(),
                state: document.getElementById('modal-state').value.trim().toUpperCase(),
                language: document.getElementById('modal-language').value.trim(),
                epg_url: document.getElementById('modal-epg-url').value.trim(),
                epg_id: document.getElementById('modal-epg-id').value.trim()
            };

            if (idx >= 0 && idx < stations.length) {
                // Update existing
                stations[idx] = newStationData;
                showToast('Station updated successfully');
            } else {
                // Add new
                stations.unshift(newStationData);
                showToast('New station added successfully');
            }

            saveStationsToStorage();
            closeModal();
        }

        function deleteStation(event, index) {
            if (event) event.stopPropagation();
            const station = stations[index];
            if (!station) return;

            if (confirm(`Are you sure you want to delete "${station.name}"?`)) {
                stations.splice(index, 1);
                
                // If current playing station was deleted
                if (currentStation && currentStation.name === station.name) {
                    if (hls) hls.destroy();
                    audio.pause();
                    currentStation = null;
                    currentTitle.innerText = 'Select a Station';
                    currentSubtitle.innerText = 'Click on any station to start streaming';
                    playPauseBtn.disabled = true;
                    equalizer.classList.add('hidden');
                }

                saveStationsToStorage();
                showToast('Station deleted');
            }
        }

        // Export and Import Data JSON
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stations, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "akashvani_stations.json");
            document.body.appendChild(dlAnchorElem);
            dlAnchorElem.click();
            dlAnchorElem.remove();
            showToast('Stations exported to JSON');
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function (e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        stations = imported;
                        saveStationsToStorage();
                        showToast(`Successfully imported ${imported.length} stations!`);
                    } else {
                        alert('Invalid JSON format. Array of station objects expected.');
                    }
                } catch (err) {
                    alert('Error parsing uploaded JSON file.');
                }
            };
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0]);
            }
        }

        function resetDefaultData() {
            if (confirm('Are you sure you want to reset all stations to default dataset? Custom changes will be cleared.')) {
                stations = [...DEFAULT_STATIONS_DATA];
                saveStationsToStorage();
                showToast('Restored default radio stations');
            }
        }

        // Filter Reset & Helpers
        function clearSearch() {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            renderStations();
        }

        function resetFilters() {
            searchInput.value = '';
            stateSelect.value = '';
            languageSelect.value = '';
            clearSearchBtn.classList.add('hidden');
            switchTab('all');
            renderStations();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = message;
            toast.classList.remove('hidden');

            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
