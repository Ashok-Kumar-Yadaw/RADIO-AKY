<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akashvani Live - Radio India</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- HLS.js for m3u8 streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        /* Soundwave animation */
        .bar {
            width: 3px;
            background: #f97316;
            animation: bounce 1.2s ease-in-out infinite;
            border-radius: 3px;
        }
        .bar:nth-child(2) { animation-delay: -1.0s; }
        .bar:nth-child(3) { animation-delay: -0.8s; }
        .bar:nth-child(4) { animation-delay: -0.6s; }
        .bar:nth-child(5) { animation-delay: -0.4s; }
        @keyframes bounce {
            0%, 100% { height: 4px; }
            50% { height: 22px; }
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans overflow-hidden bg-slate-950 text-slate-100">

    <!-- Header Section -->
    <header class="h-16 border-b border-slate-800 bg-slate-900/80 backdrop-blur px-4 md:px-8 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-orange-500 to-amber-400 p-2 rounded-xl shadow-lg shadow-orange-500/20 text-white">
                <i data-lucide="radio" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide bg-gradient-to-r from-orange-400 to-amber-200 bg-clip-text text-transparent">
                    AKASHVANI LIVE
                </h1>
                <p class="text-xs text-slate-400">All India Radio Streams</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <span id="station-count" class="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                0 Stations
            </span>
            <button onclick="openAddModal()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-orange-500 hover:bg-orange-400 text-slate-950 transition">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Add Station</span>
            </button>
            <button id="toggle-favs-btn" onclick="toggleFavoritesFilter()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                <i data-lucide="heart" class="w-4 h-4 text-rose-500"></i>
                <span id="fav-btn-text">Favorites</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Sidebar Controls & Filters -->
        <aside class="w-full md:w-80 border-b md:border-b-0 md:border-r border-slate-800 bg-slate-900/50 p-4 flex flex-col gap-4 shrink-0 overflow-y-auto">
            
            <!-- Search Bar -->
            <div>
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 block">Search Station</label>
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" id="search-input" placeholder="Name or City..." 
                           class="w-full pl-9 pr-8 py-2 bg-slate-800/80 border border-slate-700/80 rounded-lg text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-orange-500 transition">
                    <button id="clear-search" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- State Filter -->
            <div>
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 block">State / Region</label>
                <select id="state-select" class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700/80 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-orange-500 transition">
                    <option value="">All States</option>
                </select>
            </div>

            <!-- Language Filter -->
            <div>
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 block">Language</label>
                <select id="language-select" class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700/80 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-orange-500 transition">
                    <option value="">All Languages</option>
                </select>
            </div>

            <!-- Import / Export Actions -->
            <div class="pt-2 border-t border-slate-800/80 flex flex-col gap-2">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 block">Manage Data</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="exportJSON()" class="flex items-center justify-center gap-1.5 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 text-xs transition">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i> Export
                    </button>
                    <label class="flex items-center justify-center gap-1.5 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 text-xs transition cursor-pointer">
                        <i data-lucide="upload" class="w-3.5 h-3.5"></i> Import
                        <input type="file" id="import-file" accept=".json" class="hidden" onchange="importJSON(event)">
                    </label>
                </div>
                <button onclick="resetToDefaultData()" class="flex items-center justify-center gap-1.5 px-3 py-1.5 text-xs text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 rounded-lg transition mt-1">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Reset to Defaults
                </button>
            </div>

            <!-- Quick Stats & Reset -->
            <div class="mt-auto pt-4 border-t border-slate-800 flex justify-between items-center text-xs text-slate-500">
                <button onclick="resetFilters()" class="text-orange-400 hover:underline flex items-center gap-1">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset Filters
                </button>
                <span id="visible-count">Showing 0</span>
            </div>
        </aside>

        <!-- Radio Grid Area -->
        <main class="flex-1 p-4 md:p-6 overflow-y-auto pb-28">
            <div id="stations-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                <!-- Station Cards injected dynamically -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
                <div class="p-4 bg-slate-900 rounded-full border border-slate-800 text-slate-500 mb-3">
                    <i data-lucide="radio-off" class="w-10 h-10"></i>
                </div>
                <h3 class="text-lg font-semibold text-slate-300">No stations found</h3>
                <p class="text-sm text-slate-500 max-w-sm mt-1">Try adjusting your search queries or category filters.</p>
            </div>
        </main>
    </div>

    <!-- Edit/Add Modal -->
    <div id="station-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-200">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 id="modal-title" class="text-lg font-bold text-slate-100 mb-4">Edit Station</h3>
            
            <form id="station-form" onsubmit="handleSaveStation(event)" class="space-y-3">
                <input type="hidden" id="edit-index" value="-1">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Station Name *</label>
                    <input type="text" id="input-name" required class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Stream URL (.m3u8) *</label>
                    <input type="url" id="input-stream" required class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">State / Region *</label>
                        <input type="text" id="input-state" required class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Language *</label>
                        <input type="text" id="input-language" required class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">EPG URL (Optional)</label>
                        <input type="url" id="input-epg-url" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">EPG ID (Optional)</label>
                        <input type="text" id="input-epg-id" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-orange-500 hover:bg-orange-400 text-slate-950 rounded-lg text-xs font-semibold transition">Save Station</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Sticky Audio Player Bar -->
    <footer id="player-bar" class="fixed bottom-0 left-0 right-0 h-24 bg-slate-900/95 border-t border-slate-800/80 backdrop-blur-md px-4 md:px-8 flex items-center justify-between z-20 shadow-2xl">
        
        <!-- Currently Playing Info -->
        <div class="flex items-center gap-4 w-1/3 min-w-[200px]">
            <div class="relative w-12 h-12 rounded-xl bg-slate-800 border border-slate-700/80 flex items-center justify-center shrink-0 overflow-hidden group">
                <i id="player-icon" data-lucide="radio" class="w-6 h-6 text-orange-400"></i>
                <!-- Equalizer Animation when playing -->
                <div id="equalizer" class="hidden absolute inset-0 bg-slate-900/90 flex items-center justify-center gap-0.5">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
            <div class="overflow-hidden">
                <h4 id="current-title" class="font-semibold text-sm text-slate-200 truncate">Select a Station</h4>
                <p id="current-subtitle" class="text-xs text-slate-400 truncate">Click on any station to start streaming</p>
                <div id="epg-link-container" class="hidden mt-0.5">
                    <a id="current-epg" href="#" target="_blank" rel="noopener noreferrer" class="text-[11px] text-orange-400 hover:underline inline-flex items-center gap-1">
                        View Schedule <i data-lucide="external-link" class="w-2.5 h-2.5"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Player Controls -->
        <div class="flex flex-col items-center gap-1 w-1/3">
            <div class="flex items-center gap-4">
                <button id="play-pause-btn" onclick="togglePlayPause()" disabled class="w-12 h-12 rounded-full bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold flex items-center justify-center transition disabled:opacity-40 disabled:hover:bg-orange-500 shadow-lg shadow-orange-500/20">
                    <i id="play-btn-icon" data-lucide="play" class="w-6 h-6 fill-current ml-0.5"></i>
                </button>
            </div>
            <span id="player-status" class="text-[11px] font-medium text-slate-500 uppercase tracking-wider">Ready</span>
        </div>

        <!-- Volume & Tools -->
        <div class="flex items-center justify-end gap-3 w-1/3">
            <button id="mute-btn" onclick="toggleMute()" class="text-slate-400 hover:text-slate-200 transition">
                <i id="mute-icon" data-lucide="volume-2" class="w-5 h-5"></i>
            </button>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" 
                   class="w-24 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500">
        </div>
    </footer>

    <!-- Hidden Audio Element -->
    <audio id="audio-player" class="hidden"></audio>

            { "name": "FM Gold Mumbai", "stream_url": "https://d3r9rhourdc02u.cloudfront.net/assets/radio/airmum01/air049_Auto.m3u8", "state": "MAHARASHTRA", "language": "Marathi, Hindi, English", "epg_url": "https://cuesheets.prasarbharati.org/viewsheet/128", "epg_id": "169" },
            { "name": "FM Rainbow Mumbai", "stream_url": "https://d3r9rhourdc02u.cloudfront.net/assets/radio/airmum02/air050_Auto.m3u8", "state": "MAHARASHTRA", "language": "Marathi, Hindi, English", "epg_url": "https://cuesheets.prasarbharati.org/viewsheet/129", "epg_id": "170" },
            { "name": "Akashvani Pune", "stream_url": "https://radio.wavespb.com/live/39d650ca0476a1fe/39d650ca0476a1fe.m3u8", "state": "MAHARASHTRA", "language": "Marathi, Hindi, English", "epg_url": "https://cuesheets.prasarbharati.org/viewsheet/162", "epg_id": "179" }
        ];

        // Active Stations Dataset (Loaded from LocalStorage or default)
        let STATIONS_DATA = JSON.parse(localStorage.getItem('akashvani_custom_stations')) || DEFAULT_STATIONS;

        // State variables
        let currentStation = null;
        let hls = null;
        let favorites = JSON.parse(localStorage.getItem('akashvani_favs') || '[]');
        let showOnlyFavs = false;

        // Elements
        const audio = document.getElementById('audio-player');
        const stationsGrid = document.getElementById('stations-grid');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const stateSelect = document.getElementById('state-select');
        const languageSelect = document.getElementById('language-select');
        const clearSearchBtn = document.getElementById('clear-search');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playBtnIcon = document.getElementById('play-btn-icon');
        const playerStatus = document.getElementById('player-status');
        const currentTitle = document.getElementById('current-title');
        const currentSubtitle = document.getElementById('current-subtitle');
        const epgContainer = document.getElementById('epg-link-container');
        const epgLink = document.getElementById('current-epg');
        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');
        const muteIcon = document.getElementById('mute-icon');
        const equalizer = document.getElementById('equalizer');

        // Modal Elements
        const stationModal = document.getElementById('station-modal');
        const modalTitle = document.getElementById('modal-title');
        const editIndexInput = document.getElementById('edit-index');
        const inputName = document.getElementById('input-name');
        const inputStream = document.getElementById('input-stream');
        const inputState = document.getElementById('input-state');
        const inputLanguage = document.getElementById('input-language');
        const inputEpgUrl = document.getElementById('input-epg-url');
        const inputEpgId = document.getElementById('input-epg-id');

        // Save data to localStorage
        function persistStations() {
            localStorage.setItem('akashvani_custom_stations', JSON.stringify(STATIONS_DATA));
            document.getElementById('station-count').innerText = `${STATIONS_DATA.length} Stations`;
        }

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            initFilterOptions();
            renderStations();
            setupAudioEvents();
            lucide.createIcons();
            document.getElementById('station-count').innerText = `${STATIONS_DATA.length} Stations`;
        });

        // Initialize Filter Dropdowns
        function initFilterOptions() {
            const currentSelectedState = stateSelect.value;
            const currentSelectedLang = languageSelect.value;

            stateSelect.innerHTML = '<option value="">All States</option>';
            languageSelect.innerHTML = '<option value="">All Languages</option>';

            const states = new Set();
            const languages = new Set();

            STATIONS_DATA.forEach(s => {
                if (s.state) states.add(s.state.trim().toUpperCase());
                if (s.language) {
                    s.language.split(',').forEach(l => languages.add(l.trim()));
                }
            });

            Array.from(states).sort().forEach(state => {
                const opt = document.createElement('option');
                opt.value = state;
                opt.textContent = state;
                if (state === currentSelectedState) opt.selected = true;
                stateSelect.appendChild(opt);
            });

            Array.from(languages).sort().forEach(lang => {
                const opt = document.createElement('option');
                opt.value = lang;
                opt.textContent = lang;
                if (lang === currentSelectedLang) opt.selected = true;
                languageSelect.appendChild(opt);
            });

            searchInput.oninput = () => {
                clearSearchBtn.classList.toggle('hidden', !searchInput.value);
                renderStations();
            };

            stateSelect.onchange = renderStations;
            languageSelect.onchange = renderStations;
        }

        // Filter and Render Station Cards
        function renderStations() {
            const query = searchInput.value.toLowerCase().trim();
            const selectedState = stateSelect.value;
            const selectedLanguage = languageSelect.value;

            const filtered = STATIONS_DATA.map((station, originalIndex) => ({ station, originalIndex }))
                .filter(({ station }) => {
                    const matchesSearch = station.name.toLowerCase().includes(query) || 
                                          station.state.toLowerCase().includes(query);
                    const matchesState = !selectedState || station.state.toUpperCase() === selectedState;
                    const matchesLanguage = !selectedLanguage || station.language.includes(selectedLanguage);
                    const matchesFavs = !showOnlyFavs || favorites.includes(station.name);

                    return matchesSearch && matchesState && matchesLanguage && matchesFavs;
                });

            stationsGrid.innerHTML = '';
            document.getElementById('visible-count').innerText = `Showing ${filtered.length}`;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                filtered.forEach(({ station, originalIndex }) => {
                    const isFav = favorites.includes(station.name);
                    const isPlayingCurrent = currentStation && currentStation.name === station.name;

                    const card = document.createElement('div');
                    card.className = `group relative p-4 rounded-xl border transition-all duration-200 cursor-pointer flex flex-col justify-between ${
                        isPlayingCurrent 
                        ? 'bg-slate-900 border-orange-500/80 shadow-lg shadow-orange-500/10' 
                        : 'bg-slate-900/60 hover:bg-slate-900 border-slate-800/80 hover:border-slate-700'
                    }`;

                    card.onclick = () => selectStation(station);

                    card.innerHTML = `
                        <div>
                            <div class="flex items-start justify-between gap-2 mb-2">
                                <div class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase bg-orange-500/10 text-orange-400 border border-orange-500/20 truncate max-w-[120px]">
                                    ${station.state}
                                </div>
                                <div class="flex items-center gap-1">
                                    <button onclick="openEditModal(event, ${originalIndex})" title="Edit station" class="text-slate-500 hover:text-orange-400 transition p-1">
                                        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <button onclick="deleteStation(event, ${originalIndex})" title="Delete station" class="text-slate-500 hover:text-rose-400 transition p-1">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <button onclick="toggleFavorite(event, '${station.name}')" title="Favorite" class="text-slate-500 hover:text-rose-500 transition p-1">
                                        <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-rose-500 text-rose-500' : ''}"></i>
                                    </button>
                                </div>
                            </div>
                            <h3 class="font-semibold text-base text-slate-100 group-hover:text-orange-400 transition truncate mb-1">
                                ${station.name}
                            </h3>
                            <p class="text-xs text-slate-400 truncate mb-3">
                                ${station.language}
                            </p>
                        </div>
                        
                        <div class="pt-3 border-t border-slate-800/60 flex items-center justify-between text-xs text-slate-500">
                            <span class="flex items-center gap-1 text-[11px]">
                                <i data-lucide="wifi" class="w-3 h-3 text-emerald-400"></i> Live Stream
                            </span>
                            ${station.epg_url && station.epg_url.includes('http') ? `
                                <a href="${station.epg_url}" target="_blank" onclick="event.stopPropagation()" class="text-slate-400 hover:text-slate-200 flex items-center gap-1 text-[11px]">
                                    Schedule <i data-lucide="external-link" class="w-2.5 h-2.5"></i>
                                </a>
                            ` : ''}
                        </div>
                    `;

                    stationsGrid.appendChild(card);
                });
                lucide.createIcons();
            }
        }

        // Add / Edit Modal Controls
        function openAddModal() {
            modalTitle.innerText = "Add New Station";
            editIndexInput.value = "-1";
            inputName.value = "";
            inputStream.value = "";
            inputState.value = "";
            inputLanguage.value = "";
            inputEpgUrl.value = "";
            inputEpgId.value = "";
            stationModal.classList.remove('hidden');
            stationModal.classList.add('flex');
        }

        function openEditModal(event, index) {
            event.stopPropagation();
            const station = STATIONS_DATA[index];
            if (!station) return;

            modalTitle.innerText = "Edit Station";
            editIndexInput.value = index;
            inputName.value = station.name || "";
            inputStream.value = station.stream_url || "";
            inputState.value = station.state || "";
            inputLanguage.value = station.language || "";
            inputEpgUrl.value = station.epg_url || "";
            inputEpgId.value = station.epg_id || "";

            stationModal.classList.remove('hidden');
            stationModal.classList.add('flex');
        }

        function closeModal() {
            stationModal.classList.add('hidden');
            stationModal.classList.remove('flex');
        }

        function handleSaveStation(event) {
            event.preventDefault();

            const newStation = {
                name: inputName.value.trim(),
                stream_url: inputStream.value.trim(),
                state: inputState.value.trim().toUpperCase(),
                language: inputLanguage.value.trim(),
                epg_url: inputEpgUrl.value.trim(),
                epg_id: inputEpgId.value.trim()
            };

            const idx = parseInt(editIndexInput.value, 10);
            if (idx >= 0 && idx < STATIONS_DATA.length) {
                // Update existing
                STATIONS_DATA[idx] = newStation;
            } else {
                // Add new
                STATIONS_DATA.unshift(newStation);
            }

            persistStations();
            initFilterOptions();
            renderStations();
            closeModal();
        }

        function deleteStation(event, index) {
            event.stopPropagation();
            const station = STATIONS_DATA[index];
            if (!station) return;

            if (confirm(`Are you sure you want to delete station "${station.name}"?`)) {
                if (currentStation && currentStation.name === station.name) {
                    if (audio) audio.pause();
                    currentStation = null;
                    currentTitle.innerText = "Select a Station";
                    currentSubtitle.innerText = "Click on any station to start streaming";
                    playPauseBtn.disabled = true;
                    updatePlayerState('Ready', false);
                }

                STATIONS_DATA.splice(index, 1);
                persistStations();
                initFilterOptions();
                renderStations();
            }
        }

        // Export and Import Features
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(STATIONS_DATA, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "akashvani_stations.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        STATIONS_DATA = parsed;
                        persistStations();
                        initFilterOptions();
                        renderStations();
                    } else {
                        alert("Invalid JSON format. Expected an array of stations.");
                    }
                } catch (err) {
                    alert("Could not parse JSON file: " + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function resetToDefaultData() {
            if (confirm("Reset all stations to original defaults? Any custom modifications will be replaced.")) {
                STATIONS_DATA = [...DEFAULT_STATIONS];
                persistStations();
                initFilterOptions();
                renderStations();
            }
        }

        // Station Selection & HLS Playback Logic
        function selectStation(station) {
            currentStation = station;
            currentTitle.innerText = station.name;
            currentSubtitle.innerText = `${station.state} • ${station.language}`;

            if (station.epg_url && station.epg_url.includes('http')) {
                epgLink.href = station.epg_url;
                epgContainer.classList.remove('hidden');
            } else {
                epgContainer.classList.add('hidden');
            }

            playPauseBtn.disabled = false;
            updatePlayerState('Loading...', true);

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({ enableWorker: true });
                hls.loadSource(station.stream_url);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    audio.play().catch(() => updatePlayerState('Click Play', false));
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        updatePlayerState('Stream Error', false);
                    }
                });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari Native HLS Support
                audio.src = station.stream_url;
                audio.play().catch(() => updatePlayerState('Click Play', false));
            } else {
                updatePlayerState('HLS Not Supported', false);
            }

            renderStations();
        }

        // Controls Logic
        function togglePlayPause() {
            if (!currentStation) return;
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function setupAudioEvents() {
            audio.addEventListener('play', () => {
                updatePlayerState('Playing', true);
                playBtnIcon.setAttribute('data-lucide', 'pause');
                equalizer.classList.remove('hidden');
                lucide.createIcons();
            });

            audio.addEventListener('pause', () => {
                updatePlayerState('Paused', false);
                playBtnIcon.setAttribute('data-lucide', 'play');
                equalizer.classList.add('hidden');
                lucide.createIcons();
            });

            audio.addEventListener('waiting', () => {
                updatePlayerState('Buffering...', true);
            });

            volumeSlider.addEventListener('input', (e) => {
                audio.volume = e.target.value;
                audio.muted = audio.volume === 0;
                updateMuteIcon();
            });
        }

        function toggleMute() {
            audio.muted = !audio.muted;
            updateMuteIcon();
        }

        function updateMuteIcon() {
            if (audio.muted || audio.volume === 0) {
                muteIcon.setAttribute('data-lucide', 'volume-x');
            } else {
                muteIcon.setAttribute('data-lucide', 'volume-2');
            }
            lucide.createIcons();
        }

        function updatePlayerState(statusText, isPlaying) {
            playerStatus.innerText = statusText;
        }

        // Favorites Handling
        function toggleFavorite(event, stationName) {
            event.stopPropagation();
            if (favorites.includes(stationName)) {
                favorites = favorites.filter(f => f !== stationName);
            } else {
                favorites.push(stationName);
            }
            localStorage.setItem('akashvani_favs', JSON.stringify(favorites));
            renderStations();
        }

        function toggleFavoritesFilter() {
            showOnlyFavs = !showOnlyFavs;
            const btn = document.getElementById('toggle-favs-btn');
            const text = document.getElementById('fav-btn-text');

            if (showOnlyFavs) {
                btn.classList.add('bg-rose-500/20', 'border-rose-500/40', 'text-rose-300');
                text.innerText = 'Show All';
            } else {
                btn.classList.remove('bg-rose-500/20', 'border-rose-500/40', 'text-rose-300');
                text.innerText = 'Favorites';
            }
            renderStations();
        }

        function clearSearch() {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            renderStations();
        }

        function resetFilters() {
            searchInput.value = '';
            stateSelect.value = '';
            languageSelect.value = '';
            showOnlyFavs = false;
            clearSearchBtn.classList.add('hidden');
            
            const btn = document.getElementById('toggle-favs-btn');
            btn.classList.remove('bg-rose-500/20', 'border-rose-500/40', 'text-rose-300');
            document.getElementById('fav-btn-text').innerText = 'Favorites';

            renderStations();
        }
    </script>
</body>
</html>
